<!DOCTYPE html>
<html>
<head>
  <title>Happy Birthday Dad!</title>
  <style>
    body {
      background: #6a00a8;
      text-align: center;
      color: white;
      font-family: sans-serif;
    }
    #bonzi {
      width: 300px;
      margin-top: 50px;
    }
  </style>
</head>
<body>
  <h1>Happy Birthday Dad!</h1>
  <img id="bonzi" src="assets/bonzi/frames/idle_001.png">

  <script>
    const frames = [
      "assets/bonzi/frames/wave_000.png",
      "assets/bonzi/frames/wave_001.png",
      "assets/bonzi/frames/wave_002.png",
      "assets/bonzi/frames/wave_003.png",
      "assets/bonzi/frames/wave_004.png",
      "assets/bonzi/frames/wave_005.png",
      "assets/bonzi/frames/wave_006.png",
      "assets/bonzi/frames/wave_007.png",
      "assets/bonzi/frames/wave_008.png",
      "assets/bonzi/frames/wave_009.png",
      "assets/bonzi/frames/wave_010.png",
      "assets/bonzi/frames/wave_011.png",
      "assets/bonzi/frames/wave_012.png",
      "assets/bonzi/frames/wave_013.png",
      "assets/bonzi/frames/wave_014.png"
    ];

    let i = 0;
    setInterval(() => {
      document.getElementById("bonzi").src = frames[i];
      i = (i + 1) % frames.length;
    }, 150);
  </script>

  <script src="bonzi.js"></script>
</body>
</html>
